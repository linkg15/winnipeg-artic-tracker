
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Winnipeg Artic Tracker</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
body {
  margin: 0;
  background: #101820;
  color: white;
  font-family: Arial;
}
header { padding: 15px; }
#map { height: 75vh; width: 100%; }
</style>
</head>
<body>
<header>
<h2>🚌 Winnipeg Artic Tracker</h2>
<p>Winnipeg, Manitoba</p>
</header>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([49.8951, -97.1384], 12);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap'
}).addTo(map);

L.marker([49.8951, -97.1384])
 .addTo(map)
 .bindPopup('Winnipeg Transit Articulated Bus Tracker')
 .openPopup();
</script>
</body>
</html>
